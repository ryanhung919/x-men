name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Node)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests (Node environment)
        run: pnpm test:unit
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-node-${{ matrix.node-version }}
          path: |
            coverage/unit
          retention-days: 7

  deno-unit-tests:
    name: Unit Tests (Deno)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.5.4
      - name: Run Deno unit tests
        run: pnpm test:unit:deno
      - name: Upload Deno test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deno-test-results-node-${{ matrix.node-version }}
          path: coverage/deno
          retention-days: 7
          if-no-files-found: warn

  component-tests:
    name: Component Tests (happy-dom)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run component tests (happy-dom environment)
        run: pnpm test:component
        env:
          NODE_ENV: test
          NODE_OPTIONS: '--experimental-vm-modules --max-old-space-size=4096'
      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results-node-${{ matrix.node-version }}
          path: |
            coverage/component
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Check required tools
        run: jq --version && openssl version
      - name: Start ephemeral local Supabase
        run: supabase start
      - name: Point the job at the local Supabase only
        # Integration/e2e tests seed through /seed, which DROPS and recreates the schema.
        # They must never see hosted credentials, so no secrets.* are used in this job:
        # every value below comes from the throwaway local stack or is generated per run.
        run: |
          supabase status -o json > "$RUNNER_TEMP/sb.json"
          SEED=$(openssl rand -hex 16); DEMO=ci-demo-$(openssl rand -hex 6); GUEST=ci-guest-$(openssl rand -hex 6)
          echo "::add-mask::$SEED"; echo "::add-mask::$DEMO"; echo "::add-mask::$GUEST"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY "$RUNNER_TEMP/sb.json")"
            echo "POSTGRES_URL=$(jq -r .DB_URL "$RUNNER_TEMP/sb.json")"
            echo "POSTGRES_SSL=disable"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "SEED_SECRET=$SEED"
            echo "DEMO_PASSWORD=$DEMO"
            echo "GUEST_PASSWORD=$GUEST"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sb.json"
      - name: Refuse to run against a non-local database
        run: |
          for v in "$NEXT_PUBLIC_SUPABASE_URL" "$POSTGRES_URL"; do
            case "$v" in
              *127.0.0.1*|*localhost*) ;;
              *) echo "Refusing to run: a Supabase URL is not local"; exit 1 ;;
            esac
          done
      - name: Check database status
        run: |
          echo "Checking database connection..."
          pnpm db:status || echo "⚠️ Database status check failed, will seed during tests"
      - name: Build Next.js app
        run: pnpm build
      - name: Start Next.js server in background
        env:
          PORT: 3000
        run: |
          echo "Starting Next.js server..."
          pnpm start &
          echo $! > .next-pid
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/health 2>/dev/null || curl -f http://localhost:3000 2>/dev/null; do
            echo "Waiting for server..."
            sleep 2
          done'
          echo "✅ Server is ready"
      - name: Seed database
        run: |
          echo "Seeding database..."
          pnpm db:seed
          echo "✅ Database seeded"
      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          pnpm test:integration
      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-pid ]; then
            echo "Stopping Next.js server..."
            kill $(cat .next-pid) || true
            rm .next-pid
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, deno-unit-tests, component-tests, integration-tests, e2e-tests]
    if: always()
    steps:
      - name: Generate test summary
        run: |
          echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "**Unit Tests (Node)**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Unit Tests (Node)**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deno-unit-tests.result }}" == "success" ]; then
            echo "**Unit Tests (Deno)**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Unit Tests (Deno)**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.component-tests.result }}" == "success" ]; then
            echo "**Component Tests (happy-dom)**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Component Tests (happy-dom)**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "**Integration Tests**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-tests.result }}" == "skipped" ]; then
            echo "**Integration Tests**: ⏭️ Skipped (only run on main/develop)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Integration Tests**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "**E2E Tests**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-tests.result }}" == "skipped" ]; then
            echo "**E2E Tests**: ⏭️ Skipped (only run on main/develop)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**E2E Tests**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Check overall result
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests (Node) failed"
            exit 1
          fi
          if [ "${{ needs.deno-unit-tests.result }}" != "success" ]; then
            echo "Unit tests (Deno) failed"
            exit 1
          fi
          if [ "${{ needs.component-tests.result }}" != "success" ]; then
            echo "Component tests (happy-dom) failed"
            exit 1
          fi
          if [ "${{ needs.integration-tests.result }}" != "success" ] && [ "${{ needs.integration-tests.result }}" != "skipped" ]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [ "${{ needs.e2e-tests.result }}" != "success" ] && [ "${{ needs.e2e-tests.result }}" != "skipped" ]; then
            echo "E2E tests failed"
            exit 1
          fi
          echo "All tests passed"

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [unit-tests, component-tests, integration-tests]

    # Only run E2E tests on main/develop or PRs to those branches
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version comes from packageManager in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Check required tools
        run: jq --version && openssl version
      - name: Start ephemeral local Supabase
        run: supabase start
      - name: Point the job at the local Supabase only
        # Integration/e2e tests seed through /seed, which DROPS and recreates the schema.
        # They must never see hosted credentials, so no secrets.* are used in this job:
        # every value below comes from the throwaway local stack or is generated per run.
        run: |
          supabase status -o json > "$RUNNER_TEMP/sb.json"
          SEED=$(openssl rand -hex 16); DEMO=ci-demo-$(openssl rand -hex 6); GUEST=ci-guest-$(openssl rand -hex 6)
          echo "::add-mask::$SEED"; echo "::add-mask::$DEMO"; echo "::add-mask::$GUEST"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY "$RUNNER_TEMP/sb.json")"
            echo "POSTGRES_URL=$(jq -r .DB_URL "$RUNNER_TEMP/sb.json")"
            echo "POSTGRES_SSL=disable"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "SEED_SECRET=$SEED"
            echo "DEMO_PASSWORD=$DEMO"
            echo "GUEST_PASSWORD=$GUEST"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sb.json"
      - name: Refuse to run against a non-local database
        run: |
          for v in "$NEXT_PUBLIC_SUPABASE_URL" "$POSTGRES_URL"; do
            case "$v" in
              *127.0.0.1*|*localhost*) ;;
              *) echo "Refusing to run: a Supabase URL is not local"; exit 1 ;;
            esac
          done

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build Next.js app
        run: pnpm build

      - name: Start Next.js server in background
        env:
          PORT: 3000
        run: |
          echo "Starting Next.js server..."
          pnpm start &
          echo $! > .next-pid

          echo "Waiting for server to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3000/api/health 2>/dev/null || curl -f http://localhost:3000 2>/dev/null; do
            echo "Waiting for server..."
            sleep 2
          done'

          echo "✅ Server is ready"

      - name: Run E2E tests (with built-in seeding via globalSetup)
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
        run: pnpm test:e2e

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-pid ]; then
            echo "Stopping Next.js server..."
            kill $(cat .next-pid) || true
            rm .next-pid
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
